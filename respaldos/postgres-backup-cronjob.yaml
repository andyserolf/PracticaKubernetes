apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-cronjob
  namespace: produccion
spec:
  schedule: "0 2 * * *" # Todos los días a las 2:00 AM
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: postgres-backup
            image: postgres:15-alpine
            command:
            - /bin/sh
            - -c
            - |
              FECHA=$(date +%Y%m%d_%H%M%S)
              pg_dump -h postgres-service -U postgres_user -d andys_pipeart > /backups/postgres_backup_$FECHA.sql
              echo "Backup relacional PostgreSQL completado: postgres_backup_$FECHA.sql"
            env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            volumeMounts:
            - name: backup-storage
              mountPath: /backups
          restartPolicy: OnFailure
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: backup-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-pvc
  namespace: produccion
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi