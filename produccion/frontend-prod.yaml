apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-prod-deployment
  namespace: produccion
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-prod
    spec:
  template:
    metadata:
      labels:
        app: frontend-prod
    spec:
      containers:
      - name: frontend
        image: andyserolf/andys-pipeart-frontend:v1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-prod-service
  namespace: produccion
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: frontend-prod