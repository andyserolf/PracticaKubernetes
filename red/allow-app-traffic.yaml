apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: produccion
spec:
  podSelector:
    matchLabels:
      app: backend-prod
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend-prod
    ports:
    - protocol: TCP
      port: 3000